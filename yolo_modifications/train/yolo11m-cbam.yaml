# Ultralytics YOLO 🚀, AGPL-3.0 license
# Standard YOLO11m for reliable training
# CBAM wrapper pattern is available in custom_modules.py for future optimization

# Parameters
nc: 2  # number of classes (parasite, artifact)
scales: # model compound scaling constants, i.e. 'model=yolo11m.yaml' will call yolo11.yaml with scale 'm'
  # [depth, width, max_channels]
  m: [0.50, 1.00, 512]  # YOLO11m scaling: 50% depth, 100% width, 512 max channels

# YOLO11m backbone (standard + post-backbone CBAM)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, C3k2, [128, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 1, C3k2, [256, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 1, C3k2, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 1, C3k2, [512, False]]
  - [-1, 1, SPPF, [512, 5]]
  - [-1, 1, C2PSA, [512]]
  # Post-backbone attention: Apply CBAM after all backbone feature extraction
  - [-1, 1, CBAM, [512]]  # CBAM attention on backbone output (512 channels)

# YOLO11m head (standard)
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, False]]

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, C3k2, [256, False]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, False]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, False]]

  - [[15, 18, 21], 1, Detect, [nc]]
