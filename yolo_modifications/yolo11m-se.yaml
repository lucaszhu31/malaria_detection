# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11 medium model with CBAM (Channel + Spatial Attention) for malaria detection

# Parameters
nc: 2  # number of classes (parasite, artifact)
scales: # model compound scaling constants, i.e. 'model=yolo11m.yaml' will call yolo11.yaml with scale 'm'
  # [depth, width, max_channels]
  m: [0.50, 1.00, 512]  # YOLO11m scaling: 50% depth, 100% width, 512 max channels

# YOLO11m backbone with CBAM attention
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2  (Input: 1280x1280 -> 640x640)
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4  (640x640 -> 320x320)
  - [-1, 2, C2f_CBAM, [128, True]]  # 2  ← CBAM attention added!
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8  (320x320 -> 160x160)
  - [-1, 2, C2f_CBAM, [256, True]]  # 4  ← CBAM attention added!
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16  (160x160 -> 80x80)
  - [-1, 2, C2f_CBAM, [512, True]]  # 6  ← CBAM attention added!
  - [-1, 1, Conv, [512, 3, 2]]  # 7-P5/32  (80x80 -> 40x40)
  - [-1, 2, C2f_CBAM, [512, True]]  # 8  ← CBAM attention added!
  - [-1, 1, SPPF_CBAM, [512, 5]]  # 9  ← CBAM attention added to SPPF!

# YOLO11m head with CBAM attention in neck
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 10  (40x40 -> 80x80)
  - [[-1, 6], 1, Concat, [1]]  # 11  cat P4 (concatenate with layer 6)
  - [-1, 2, C2f_CBAM, [512, False]]  # 12  ← CBAM in neck!

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 13  (80x80 -> 160x160)
  - [[-1, 4], 1, Concat, [1]]  # 14  cat P3 (concatenate with layer 4)
  - [-1, 2, C2f_CBAM, [256, False]]  # 15  ← CBAM in neck!

  - [-1, 1, Conv, [256, 3, 2]]  # 16  (160x160 -> 80x80)
  - [[-1, 12], 1, Concat, [1]]  # 17  cat head P4
  - [-1, 2, C2f_CBAM, [512, False]]  # 18  ← CBAM in neck!

  - [-1, 1, Conv, [512, 3, 2]]  # 19  (80x80 -> 40x40)
  - [[-1, 9], 1, Concat, [1]]  # 20  cat head P5
  - [-1, 2, C2f_CBAM, [512, False]]  # 21  ← CBAM in neck!

  - [[15, 18, 21], 1, Detect, [nc]]  # 22  Detect(P3, P4, P5) - multi-scale detection
