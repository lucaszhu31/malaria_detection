# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11m with Contrast Enhanced FPN (CE FPN) + CBAM
# Post-backbone attention for malaria parasite detection

# Parameters
nc: 2  # number of classes (Trophozoite, WBC)
scales: # model compound scaling constants
  m: [0.50, 1.00, 512]  # YOLO11m scaling

# YOLO11m backbone (standard)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, C3k2, [128, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 1, C3k2, [256, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 1, C3k2, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 1, C3k2, [512, False]]
  - [-1, 1, SPPF, [512, 5]]
  - [-1, 1, C2PSA, [512]]
  # Post-backbone enhancement: CE FPN for contrast enhancement
  - [-1, 1, CE_FPN, [512]]  # Enhance parasite-background contrast
  # Post-backbone attention: CBAM for focused detection
  - [-1, 1, CBAM, [512]]  # Channel + spatial attention on enhanced features

# YOLO11m head (standard)
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, False]]

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, C3k2, [256, False]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, False]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 1, C3k2, [512, False]]

  - [[15, 18, 21], 1, Detect, [nc]]
