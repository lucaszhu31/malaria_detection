# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11 medium model with CBAM (Channel + Spatial Attention) for malaria detection

# Parameters
nc: 2  # number of classes (parasite, artifact)
scales: # model compound scaling constants, i.e. 'model=yolo11m.yaml' will call yolo11.yaml with scale 'm'
  # [depth, width, max_channels]
  m: [0.50, 1.00, 512]  # YOLO11m scaling: 50% depth, 100% width, 512 max channels

# YOLO11m backbone with CBAM attention
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0
  - [-1, 1, Conv, [128, 3, 2]]  # 1
  - [-1, 2, C2f_CBAM, [128, True]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]  # 3
  - [-1, 2, C2f_CBAM, [256, True]]  # 4
  - [-1, 1, Conv, [512, 3, 2]]  # 5
  - [-1, 2, C2f_CBAM, [512, True]]  # 6
  - [-1, 1, Conv, [512, 3, 2]]  # 7
  - [-1, 2, C2f_CBAM, [512, True]]  # 8  ← CBAM attention added!
  - [-1, 1, SPPF_CBAM, [512, 5]]  # 9  ← CBAM attention added to SPPF!

# YOLO11m head with CBAM attention in neck
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 10
  - [[-1, 6], 1, Concat, [1]]  # 11
  - [-1, 2, C2f_CBAM, [512, False]]  # 12

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 13
  - [[-1, 4], 1, Concat, [1]]  # 14
  - [-1, 2, C2f_CBAM, [256, False]]  # 15

  - [-1, 1, Conv, [256, 3, 2]]  # 16
  - [[-1, 12], 1, Concat, [1]]  # 17
  - [-1, 2, C2f_CBAM, [512, False]]  # 18

  - [-1, 1, Conv, [512, 3, 2]]  # 19
  - [[-1, 9], 1, Concat, [1]]  # 20
  - [-1, 2, C2f_CBAM, [512, False]]  # 21

  - [[15, 18, 21], 1, Detect, [nc]]  # 22
